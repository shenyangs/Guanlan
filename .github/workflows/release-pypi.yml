name: release

on:
  push:
    tags:
      - "v*"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install project
        run: uv sync --extra dev

      - name: Pre-release version status
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          expected="${RAW_TAG#v}"
          GUANLAN_RELEASE_ALLOW_DIRTY=1 scripts/pre_release_status.sh "$expected"

      - name: Release quality gate
        run: scripts/release_gate.sh

      - name: Generate release quality report
        run: |
          uv run python scripts/generate_quality_report.py \
            --format markdown \
            --output docs/benchmark-report.md \
            --json-output docs/reports/latest-quality.json

      - name: Upload quality report artifact
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            docs/benchmark-report.md
            docs/reports/latest-quality.json

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-release version status
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          expected="${RAW_TAG#v}"
          GUANLAN_RELEASE_ALLOW_DIRTY=1 scripts/pre_release_status.sh "$expected"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1

  update-homebrew-tap:
    needs: publish-pypi
    if: ${{ needs.publish-pypi.result == 'success' }}
    runs-on: macos-latest
    env:
      HOMEBREW_TAP_REPO: shenyangs/homebrew-tap
      HOMEBREW_TAP_NAME: shenyangs/tap
      FORMULA_PATH: Formula/guanlan.rb
      PACKAGE_NAME: guanlan
      FORMULA_CLASS: Guanlan
      PACKAGE_HOMEPAGE: https://github.com/shenyangs/Guanlan
      PACKAGE_DESC: China-aware source and platform router for AI agents
    steps:
      - name: Validate required secret
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_GITHUB_TOKEN}" ]; then
            echo "Missing secret: HOMEBREW_TAP_GITHUB_TOKEN"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Generate Homebrew formula
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.request
          from pathlib import Path

          package_name = os.environ["PACKAGE_NAME"]
          version = os.environ["RAW_TAG"][1:] if os.environ["RAW_TAG"].startswith("v") else os.environ["RAW_TAG"]
          formula_path = Path(os.environ["FORMULA_PATH"])
          formula_class = os.environ["FORMULA_CLASS"]
          homepage = os.environ["PACKAGE_HOMEPAGE"]
          desc = os.environ["PACKAGE_DESC"]

          def normalize(name: str) -> str:
              return name.lower().replace("_", "-")

          def pick_release_file(pkg: str, ver: str) -> tuple[str, str]:
              url = f"https://pypi.org/pypi/{pkg}/{ver}/json"
              last_error = None
              for _ in range(20):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as resp:
                          data = json.load(resp)
                      break
                  except Exception as err:
                      last_error = err
                      time.sleep(6)
              else:
                  raise RuntimeError(f"Failed to fetch {url}: {last_error}")

              files = data.get("urls", [])
              sdist = next((f for f in files if f.get("packagetype") == "sdist"), None)
              if sdist:
                  return sdist["url"], sdist["digests"]["sha256"]
              wheel = next((f for f in files if f.get("packagetype") == "bdist_wheel"), None)
              if wheel:
                  return wheel["url"], wheel["digests"]["sha256"]
              raise RuntimeError(f"No release file found for {pkg}=={ver}")

          main_url, main_sha = pick_release_file(package_name, version)

          freeze_output = subprocess.check_output(
              [sys.executable, "-m", "pip", "freeze", "--exclude-editable"],
              text=True,
          )
          dependencies: list[tuple[str, str]] = []
          for line in freeze_output.splitlines():
              if "==" not in line:
                  continue
              name, ver = line.split("==", 1)
              if normalize(name) == normalize(package_name):
                  continue
              if normalize(name) in {"pip", "setuptools", "wheel"}:
                  continue
              dependencies.append((name, ver))

          # De-duplicate and sort for stable formula output.
          dedup = {(normalize(n), n, v) for n, v in dependencies}
          sorted_deps = sorted(dedup, key=lambda item: item[0])

          resources: list[str] = []
          for _, dep_name, dep_ver in sorted_deps:
              dep_url, dep_sha = pick_release_file(dep_name, dep_ver)
              resources.append(
                  "\n".join(
                      [
                          f'  resource "{dep_name}" do',
                          f'    url "{dep_url}"',
                          f'    sha256 "{dep_sha}"',
                          "  end",
                      ]
                  )
              )

          resources_block = "\n\n".join(resources)
          lines = [
              f"class {formula_class} < Formula",
              "  include Language::Python::Virtualenv",
              "",
              f'  desc "{desc}"',
              f'  homepage "{homepage}"',
              f'  url "{main_url}"',
              f'  sha256 "{main_sha}"',
              '  license "MIT"',
              "",
              '  depends_on "python@3.12"',
          ]

          if resources_block:
              lines.append("")
              lines.extend(resources_block.splitlines())

          lines.extend(
              [
                  "",
                  "  def install",
                  "    virtualenv_install_with_resources",
                  "  end",
                  "",
                  "  test do",
                  '    output = shell_output("#{bin}/guanlan --version")',
                  "    assert_match version.to_s, output",
                  "  end",
                  "end",
              ]
          )
          formula = "\n".join(lines)

          formula_path.parent.mkdir(parents=True, exist_ok=True)
          formula_path.write_text(formula + "\n", encoding="utf-8")
          PY

      - name: Push formula to tap
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" tap
          mkdir -p "tap/$(dirname "${FORMULA_PATH}")"
          cp "${FORMULA_PATH}" "tap/${FORMULA_PATH}"

          cd tap
          git add "${FORMULA_PATH}"
          if git diff --cached --quiet -- "${FORMULA_PATH}"; then
            echo "No formula changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 同步 Guanlan ${GITHUB_REF_NAME#v} Homebrew 公式"
          git push

      - name: Verify Homebrew tap install
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="${RAW_TAG#v}"
          brew untap "${HOMEBREW_TAP_NAME}" 2>/dev/null || true
          brew tap "${HOMEBREW_TAP_NAME}" "https://github.com/${HOMEBREW_TAP_REPO}.git"
          brew install "${HOMEBREW_TAP_NAME}/${PACKAGE_NAME}"
          output="$(guanlan --version)"
          echo "$output"
          if ! grep -Fq "$expected" <<<"$output"; then
            echo "Expected Guanlan ${expected} from Homebrew tap, got: ${output}"
            exit 1
          fi

  distribution-status:
    needs:
      - publish-pypi
      - update-homebrew-tap
    if: ${{ always() && needs.publish-pypi.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture distribution status
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="${RAW_TAG#v}"
          python scripts/distribution_status.py --version "$expected" --format json --output distribution-status.json || true
          python scripts/distribution_status.py --version "$expected" --format markdown --output distribution-status.md || true

      - name: Upload distribution status artifact
        uses: actions/upload-artifact@v4
        with:
          name: distribution-status
          path: |
            distribution-status.json
            distribution-status.md
