<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#f3ead8"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cf3a2f"/>
      <stop offset="100%" stop-color="#9a241d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#4b1611" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="196" fill="url(#paper)"/>

  <!-- 低对比度水势背景，只托住印章，不参与印内线条关系 -->
  <path d="M174 704 C304 642 392 730 514 666 C632 604 730 632 850 568" fill="none" stroke="#1f7683" stroke-width="16" stroke-linecap="round" opacity="0.24"/>

  <!-- 朱砂方印 -->
  <rect x="238" y="150" width="548" height="548" rx="78" fill="url(#seal)" filter="url(#shadow)"/>
  <rect x="288" y="200" width="448" height="448" rx="48" fill="none" stroke="#ffe8cf" stroke-width="18" opacity="0.78"/>

  <g transform="translate(-14 -20)">
    <!-- 上层：观。使用独立眼形，不再让线条穿插水纹或边框 -->
    <path d="M346 364 C410 306 496 288 580 322 C636 344 682 384 712 424" fill="none" stroke="#ffe8cf" stroke-width="28" stroke-linecap="round"/>
    <path d="M346 364 C410 422 496 440 580 406 C636 384 682 344 712 304" fill="none" stroke="#ffe8cf" stroke-width="28" stroke-linecap="round" opacity="0.92"/>
    <circle cx="512" cy="364" r="31" fill="none" stroke="#ffe8cf" stroke-width="21"/>
    <circle cx="512" cy="364" r="9" fill="#ffe8cf"/>

    <!-- 下层：澜。三条水纹宽度递减、留白一致，避免与外框打架 -->
    <path d="M356 506 C424 470 496 514 564 484 C612 462 650 462 692 444" fill="none" stroke="#ffe8cf" stroke-width="25" stroke-linecap="round"/>
    <path d="M356 566 C426 532 502 572 578 542 C622 524 656 526 692 514" fill="none" stroke="#ffe8cf" stroke-width="21" stroke-linecap="round" opacity="0.92"/>
    <path d="M364 620 C436 596 514 624 596 604 C636 594 666 594 694 590" fill="none" stroke="#ffe8cf" stroke-width="17" stroke-linecap="round" opacity="0.80"/>

    <!-- 小节点只作为“取源”提示，降低存在感 -->
    <circle cx="566" cy="484" r="10" fill="#ffe8cf" opacity="0.92"/>
  </g>

  <text x="512" y="842" text-anchor="middle" font-family="STKaiti, Kaiti SC, STSong, Songti SC, serif" font-size="88" fill="#27333a" letter-spacing="12">观澜</text>
</svg>
